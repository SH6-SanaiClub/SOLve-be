spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: esg-be
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: always

  data:
    redis:
      repositories:
        enabled: false

server:
  port: 8080
  
jwt:
  secret: ${JWT_SECRET}
  access-expiration: ${JWT_ACCESS_EXPIRATION:7200000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}

auth:
  verification-token-expiration: ${AUTH_VERIFICATION_TOKEN_EXPIRATION:1800000}

portone:
  api-base-url: ${PORTONE_API_URL:https://api.iamport.kr}
  api-version: ${PORTONE_API_VERSION:v1}
  api-key: ${PORTONE_API_KEY:}
  api-secret: ${PORTONE_API_SECRET:}
  imp-code: ${PORTONE_IMP_CODE:}
  payment-name-prefix: ${PORTONE_PAYMENT_NAME_PREFIX:Sanai_Contract_}
  payment-currency: ${PORTONE_PAYMENT_CURRENCY:KRW}
  payment-language: ${PORTONE_PAYMENT_LANGUAGE:ko}
  webhook-path: ${PORTONE_WEBHOOK_PATH:/payment/webhook}
  webhook-enabled: ${PORTONE_WEBHOOK_ENABLED:true}
  refund-reason-default: ${PORTONE_REFUND_REASON_DEFAULT:고객 요청에 의한 환불}
  refund-checksum-enabled: ${PORTONE_REFUND_CHECKSUM_ENABLED:true}
  api-connect-timeout: ${PORTONE_API_CONNECT_TIMEOUT:60000}
  api-read-timeout: ${PORTONE_API_READ_TIMEOUT:60000}
  api-retry-count: ${PORTONE_API_RETRY_COUNT:3}
  api-retry-delay: ${PORTONE_API_RETRY_DELAY:1000}
  allow-missing-ci-di-fallback: ${PORTONE_ALLOW_MISSING_CIDI_FALLBACK:true}
  log-enabled: ${PORTONE_LOG_ENABLED:true}
  log-level: ${PORTONE_LOG_LEVEL:INFO}
  
cloud:
  aws:
    s3:
      bucket: solve-s3-storage
    credentials:
      access-key: ${AWS_ACCESS_KEY}
      secret-key: ${AWS_SECRET_KEY}
    region:
      static: ap-northeast-2
    stack:
      auto: false

openai:
  api-key: ${OPENAI_API_KEY}
  model: ${OPENAI_MODEL:gpt-4o-mini}



app:
  report:
    verification-base-url: ${REPORT_VERIFICATION_BASE_URL:http://localhost:5173}
    watermark-image-url: ${REPORT_WATERMARK_IMAGE_URL:https://solve-s3-storage.s3.ap-northeast-2.amazonaws.com/verified.webp}
    verification-path-prefix: ${REPORT_VERIFICATION_PATH_PREFIX:/report/verify/}
    pdf:
      template-path: ${REPORT_PDF_TEMPLATE_PATH:templates/report/certificate-template.html}
      font-family: ${REPORT_PDF_FONT_FAMILY:ReportKoreanFont}
      font-locations:
        - ${REPORT_PDF_FONT_PATH_1:classpath:fonts/NotoSansKR-Regular.ttf}
        - ${REPORT_PDF_FONT_PATH_2:classpath:fonts/NotoSansKR-Medium.ttf}
        - ${REPORT_PDF_FONT_PATH_3:classpath:fonts/NotoSansKR-Bold.ttf}

  cors:
    allowed-origins:
      - ${CORS_ALLOWED_ORIGIN_1:http://localhost:5173}
      - ${CORS_ALLOWED_ORIGIN_2:http://localhost:3000}
      - ${CORS_ALLOWED_ORIGIN_2:http://192.168.0.101:5173}
