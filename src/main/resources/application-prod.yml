spring:
  datasource:
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:8}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT:10000}
      idle-timeout: ${DB_POOL_IDLE_TIMEOUT:600000}
      max-lifetime: ${DB_POOL_MAX_LIFETIME:1800000}
      pool-name: ${DB_POOL_NAME:esg-be-prod-pool}
      data-source-properties:
        ApplicationName: ${DB_APPLICATION_NAME:esg-be-prod}
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: none
  batch:
    jdbc:
      initialize-schema: never
  data:
    redis:
      host: ${REDIS_HOST:esg-redis}
      port: ${REDIS_PORT:6379}

app:
  scheduler:
    enabled: true
  batch:
    enabled: true

logging:
  level:
    com.esg.platform: INFO
